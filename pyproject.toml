[project]
name = "agentos"
version = "0.1.0"
description = "A terminal-based coding agent that drives local, multi-GPU LLM inference through an edit -> build -> verify loop."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
agentos = "agentos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentos*"]
